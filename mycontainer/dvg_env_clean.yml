name: dvg_env
channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.10
  - sra-tools
  - star
  - samtools
  - minimap2
  - bcftools
  - bedtools
  - bowtie2
  - fastqc
  - trim-galore
  - cutadapt
  - pandas
  - numpy
  - scipy
  - pysam
  - pip
  - zlib
  - bzip2
  - xz
  - libdeflate
  # R support
  - r-base=4.3
  - r-data.table
  - r-dplyr
  - r-readr
  - r-tidyr
  - r-ggplot2
  - r-tibble

  - pip:
      - matplotlib
      - seaborn